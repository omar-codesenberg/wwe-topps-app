<!doctype html><html><head><meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{width:1500px;height:780px;background:radial-gradient(120% 80% at 50% -10%,#1b2b52,#0b1022 45%,#050608);
  font-family:'Oswald',sans-serif;color:#f4f5f7;overflow:hidden}
.head{text-align:center;padding:22px 0 6px}
.head .k{font-size:13px;letter-spacing:8px;color:#9aa0a8}
.head .t{font-family:'Anton';font-size:30px;letter-spacing:1px}
.head .t b{color:#e2231a}.head .t i{font-style:normal;color:#ff7a18}
.row{display:flex;justify-content:center;gap:26px;padding:14px 30px}
.card{display:flex;flex-direction:column;align-items:center;gap:9px}
.card img{width:300px;height:auto;border-radius:18px;border:1px solid #34373c;
  box-shadow:0 14px 30px rgba(0,0,0,.55)}
.card .lbl{font-family:'Anton';font-size:14px;letter-spacing:2px;color:#cfd3d8}
.card .lbl span{color:#26d7ff}
</style></head>
<body>
  <div class="head">
    <div class="k">WRESTLING CARDS &amp; COLLECTIBLES   ·   DESIGN CONCEPT</div>
    <div class="t"><b>WCC</b> MONDAY <i>NITRO</i> THEME</div>
  </div>
  <div class="row">
    <div class="card"><img src="04-splash.jpg"><div class="lbl">01 <span>SPLASH</span></div></div>
    <div class="card"><img src="01-home-arena-v3.jpg"><div class="lbl">02 <span>HOME / ARENA</span></div></div>
    <div class="card"><img src="02-roster-slots.jpg"><div class="lbl">03 <span>SLOT ROSTER</span></div></div>
    <div class="card"><img src="03-checkout.jpg"><div class="lbl">04 <span>CHECKOUT</span></div></div>
  </div>
</body></html>
